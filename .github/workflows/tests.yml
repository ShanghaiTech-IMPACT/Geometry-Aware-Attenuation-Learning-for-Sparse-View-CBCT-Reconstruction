name: CPU checks

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q --disable-warnings
        env:
          CUDA_VISIBLE_DEVICES: ''
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
      - run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
